# vLLM serving on GB10 — see docs/BRIEF_v1.2 Appendix B1. Validated against
# libs/schemas.ServingConfig (extra keys fail loudly, see libs/common/config.py).
model: "Qwen/Qwen3-30B-A3B-Instruct-2507-FP8"
served_model_name: "qwen3"
# Qwen3-14B dense fallback (brief §4.2): the forgiving first-baseline model
# while the MoE serving/training path is being debugged.
dense_fallback_model: "Qwen/Qwen3-14B-Instruct"
dtype: "auto"            # FP8 variant
gpu_memory_utilization: 0.85
max_model_len: 32768
enable_prefix_caching: true
enable_chunked_prefill: true
enable_lora: true
# Adapter ids certified by the promotion gate (model_registry). Empty until a
# generation exists — never list an unpromoted adapter here.
lora_adapters: []
# DO NOT set CUTE_DSL_ARCH=sm_121a (hangs on GB10)
