# LoRA fine-tune hyperparameters — the single source read by scripts/smoke_train.py
# (inside the Unsloth container, via rental/training_config.py) and by rental/plan.py
# (vLLM --max-lora-rank). Validated in CI against libs.schemas.TrainingConfig.
#
# NOT here, deliberately:
#   - model identity: scripts/rental/FREEZE.yaml (pinned repo + immutable commit)
#   - per-run matrix knobs: TRAIN_MAX_SEQ_LENGTH / TRAIN_MAX_STEPS / TRAIN_BATCH_SIZE /
#     TRAIN_GRAD_ACCUM / TRAIN_MEASURE_WARMUP_STEPS env vars (rental/plan.py)
#
# Precision of the FROZEN base weights during training (owner decision 13 Nov 2026):
#   qlora_4bit  default. Base loaded in 4-bit NF4 (bitsandbytes) from the same pinned
#               BF16 repo/commit; LoRA adapters train in bf16 on top. ~17 GB of weights.
#   bf16        comparison run only (TRAIN_PRECISION=bf16): full bf16 base, ~61 GB.
#               Adopt it only if the trial shows clearly better tokens/sec.
# Either way the adapter belongs to the same base the FP8 serving checkpoint was
# quantised from, so it deploys on the FP8 server. FP8 training is not used.
precision: qlora_4bit
lora_rank: 16              # must be a vLLM-supported max-lora-rank value
lora_alpha: 32
lora_dropout: 0.0
# Must equal FREEZE.yaml adapter_targets (rental/plan.py enforces it).
target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
# Router stays frozen (Unsloth FastModel default = frozen-router policy, brief §7.7);
# smoke_train.py fails loudly if any router parameter is trainable.
gradient_checkpointing: unsloth   # unsloth | true | false
packing: false             # off: keeps per-example token accounting exact for cadence measurement
# 2e-4 is Unsloth's documented LoRA default. 1e-5 (full-fine-tune territory) moves a
# zero-initialised LoRA B so little in a 25-step bf16 smoke that the adapter's logit
# effect can round away, failing the reload "adapter affects inference" check spuriously.
learning_rate: 2.0e-4
lr_scheduler_type: linear
warmup_steps: 3
max_grad_norm: 1.0
weight_decay: 0.0
seed: 3407
