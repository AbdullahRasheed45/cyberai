[project]
name = "cyberai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "structlog>=24.1",
  "httpx>=0.27",
  "psycopg[binary]>=3.1",
  "mlflow>=2.14",
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["libs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
