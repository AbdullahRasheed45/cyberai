[project]
name = "cyberai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "structlog>=24.1",
  "httpx>=0.27",
  "psycopg[binary]>=3.1",
  "mlflow>=2.14",
  "pytest>=8.0",
  "regex>=2024.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.hatch.build.targets.wheel]
packages = ["libs", "rental", "detection_verifier", "lab"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# docs/ holds the authoritative runbooks (CLAUDE.md: "follow it exactly") —
# their embedded code fences are reference text, not source files, and must
# never be touched by an autoformatter.
extend-exclude = ["uv.lock", "docs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# UP042: keep `class X(str, Enum)` — deliberate for pydantic v2 JSON-schema/
# serialisation behaviour; StrEnum is not a drop-in replacement here.
ignore = ["UP042"]

[tool.ruff.lint.isort]
known-first-party = ["libs", "services", "lab"]

[tool.ruff.format]
quote-style = "double"
